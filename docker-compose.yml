version: "3.8"

services:
  db:
    image: postgres:17
    container_name: mailsync-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mailsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mailsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: MailSync.API/Dockerfile
    container_name: mailsync-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=mailsync;Username=postgres;Password=password123
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: MailSync.Worker/Dockerfile
    container_name: mailsync-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=mailsync;Username=postgres;Password=password123
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
