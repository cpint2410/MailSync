services:
  postgres:
    image: postgres:17
    container_name: mailsync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailsync
      POSTGRES_USER: mailsync_user
      POSTGRES_PASSWORD: ChangeThisPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailsync_user -d mailsync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
